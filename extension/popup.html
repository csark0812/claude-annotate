<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Claude Annotate</title>
<style>
  :root { --ink: #FF4D8D; --fg: #1b1b1f; --muted: #6b6b76; --line: #e4e4ea; --bg: #ffffff; --field: #f5f5f8; }
  @media (prefers-color-scheme: dark) {
    :root { --fg: #ececf1; --muted: #9a9aa6; --line: #33333b; --bg: #1c1c21; --field: #26262c; }
  }
  * { box-sizing: border-box; }
  body { margin: 0; width: 300px; font: 13px/1.4 system-ui, -apple-system, sans-serif; color: var(--fg); background: var(--bg); }
  main { padding: 14px; display: grid; gap: 12px; }
  .row { display: flex; align-items: center; justify-content: space-between; gap: 12px; }
  h1 { margin: 0; font-size: 14px; font-weight: 600; }
  .switch { position: relative; width: 40px; height: 22px; flex: none; border: 0; padding: 0; border-radius: 11px; background: var(--line); cursor: pointer; transition: background .15s; }
  .switch::after { content: ""; position: absolute; top: 3px; left: 3px; width: 16px; height: 16px; border-radius: 50%; background: #fff; box-shadow: 0 1px 2px rgba(0,0,0,.25); transition: transform .15s; }
  .switch[aria-checked="true"] { background: var(--ink); }
  .switch[aria-checked="true"]::after { transform: translateX(18px); }
  .switch:disabled { opacity: .45; cursor: default; }
  .switch:focus-visible { outline: 2px solid var(--ink); outline-offset: 2px; }
  label { display: grid; gap: 4px; color: var(--muted); font-size: 12px; }
  select { width: 100%; padding: 6px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--field); color: var(--fg); font: inherit; }
  .note { margin: 0; color: var(--muted); font-size: 12px; }
  .error { margin: 0; color: #d9324f; font-size: 12px; white-space: pre-wrap; }
  kbd { font: 11px ui-monospace, monospace; padding: 1px 4px; border: 1px solid var(--line); border-radius: 4px; }
</style>
</head>
<body>
<main>
  <div class="row">
    <h1 id="label">Annotation mode</h1>
    <button id="toggle" class="switch" role="switch" aria-checked="false" aria-labelledby="label" disabled></button>
  </div>
  <label>Send to session
    <select id="session" disabled></select>
  </label>
  <p id="note" class="note"></p>
  <p id="error" class="error" hidden></p>
</main>
<script src="popup.js" type="module"></script>
</body>
</html>
